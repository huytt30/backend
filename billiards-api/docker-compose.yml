# Chạy MySQL + API: copy .env.example thành .env, điền giá trị rồi chạy `docker compose up -d --build`
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: billiards
      MYSQL_USER: billiards
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/billiards?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: billiards
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql-data:
  uploads:
